[package]
name = "datalineague-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "plsql-lineage-scanner"
path = "src/bin/plsql-lineage-scanner.rs"

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
regex = "1"
serde_json = "1"

[features]
default = []
python-extension = ["dep:pyo3"]
